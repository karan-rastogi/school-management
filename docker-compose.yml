name: school-management

services:
  postgres:
    image: postgres:17-alpine
    container_name: school-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school}
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
      PGTZ: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - school-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school} -d ${POSTGRES_DB:-school}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  school-postgres-data:
