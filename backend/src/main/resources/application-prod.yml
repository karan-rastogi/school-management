# Production profile — activate with SPRING_PROFILES_ACTIVE=prod.
#
# Every setting comes from an environment variable. Secrets have NO default, so the application
# fails fast at startup if one is missing rather than silently booting with an insecure value.
# See ENVIRONMENT.md for the full variable list and DEPLOYMENT.md for a step-by-step guide.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    # Migrations are applied automatically on startup, before Hibernate validates the schema.
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            # Defaults keep the app bootable when AUTH_OAUTH_ENABLED=false; AuthFeatureGuard refuses
            # to start when OAuth is enabled and these are left unconfigured.
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - email
              - profile

server:
  # Hosting platforms (Render, Fly.io, ...) inject PORT; SERVER_PORT is the local convention.
  port: ${PORT:${SERVER_PORT:8080}}
  # Trust X-Forwarded-* from the platform's proxy so redirects and cookies use https.
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.school: INFO
    org.flywaydb: INFO

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    frontend-base-url: ${FRONTEND_BASE_URL}
    # Password login stays off in production (AuthFeatureGuard refuses to start if it is enabled).
    password-login:
      enabled: ${AUTH_PASSWORD_LOGIN_ENABLED:false}
      max-failed-attempts: ${AUTH_PASSWORD_MAX_FAILED_ATTEMPTS:5}
      lockout-duration: ${AUTH_PASSWORD_LOCKOUT_DURATION:PT15M}
      rate-limit:
        ip-attempts: ${AUTH_PASSWORD_RATE_IP_ATTEMPTS:20}
        email-attempts: ${AUTH_PASSWORD_RATE_EMAIL_ATTEMPTS:10}
        window: ${AUTH_PASSWORD_RATE_WINDOW:PT15M}
    oauth:
      enabled: ${AUTH_OAUTH_ENABLED:true}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:school-management}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    cookie:
      # Cookies must be Secure over https; SameSite=None is required when the SPA and the API are
      # served from different sites (e.g. Vercel + Render). Use Lax if they share a registrable domain.
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:None}
    otp:
      enabled: ${AUTH_OTP_ENABLED:true}
      sender: ${OTP_SENDER:console}
      console-expose-code: false
  notices:
    signing-secret: ${NOTICE_SIGNING_SECRET}
    storage-directory: ${NOTICE_STORAGE_DIR:./uploads/notice-attachments}
