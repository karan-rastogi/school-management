spring:
  application:
    name: school-management-backend
  config:
    import: optional:file:../.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/school}
    username: ${DB_USERNAME:school}
    password: ${DB_PASSWORD:school}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${NOTICE_MAX_ATTACHMENT_SIZE:10MB}
      max-request-size: ${NOTICE_MAX_REQUEST_SIZE:12MB}
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - email
              - profile

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  attendance:
    present-weight: ${ATTENDANCE_PRESENT_WEIGHT:1.0}
    late-weight: ${ATTENDANCE_LATE_WEIGHT:1.0}
    half-day-weight: ${ATTENDANCE_HALF_DAY_WEIGHT:0.5}
    absent-weight: ${ATTENDANCE_ABSENT_WEIGHT:0.0}
    excused-excluded-from-denominator: ${ATTENDANCE_EXCUSED_EXCLUDED:true}
    warning-threshold-percent: ${ATTENDANCE_WARNING_THRESHOLD:75.0}
  notices:
    signed-url-ttl: ${NOTICE_SIGNED_URL_TTL:PT15M}
    max-attachment-bytes: ${NOTICE_MAX_ATTACHMENT_BYTES:10485760}
    allowed-content-types: ${NOTICE_ALLOWED_CONTENT_TYPES:application/pdf,image/png,image/jpeg,image/webp,text/plain}
    storage-directory: ${NOTICE_STORAGE_DIR:./uploads/notice-attachments}
    signing-secret: ${NOTICE_SIGNING_SECRET:dev-only-notice-signing-secret-change-me-0123456789}
  id-cards:
    school-name: ${ID_CARD_SCHOOL_NAME:School}
    photo-directory: ${ID_CARD_PHOTO_DIR:./uploads/photos}
    card-width-mm: ${ID_CARD_CARD_WIDTH_MM:85.6}
    card-height-mm: ${ID_CARD_CARD_HEIGHT_MM:54}
    columns: ${ID_CARD_COLUMNS:2}
    rows: ${ID_CARD_ROWS:4}
    margin-mm: ${ID_CARD_MARGIN_MM:12}
    gutter-mm: ${ID_CARD_GUTTER_MM:8}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age-seconds: 3600
  auth:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    # Feature flags. A disabled method's endpoints return 404; its code is kept, only gated.
    password-login:
      enabled: ${AUTH_PASSWORD_LOGIN_ENABLED:false}
      max-failed-attempts: ${AUTH_PASSWORD_MAX_FAILED_ATTEMPTS:5}
      lockout-duration: ${AUTH_PASSWORD_LOCKOUT_DURATION:PT15M}
      rate-limit:
        ip-attempts: ${AUTH_PASSWORD_RATE_IP_ATTEMPTS:20}
        email-attempts: ${AUTH_PASSWORD_RATE_EMAIL_ATTEMPTS:10}
        window: ${AUTH_PASSWORD_RATE_WINDOW:PT15M}
    oauth:
      enabled: ${AUTH_OAUTH_ENABLED:true}
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
      issuer: ${JWT_ISSUER:school-management}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    otp:
      enabled: ${AUTH_OTP_ENABLED:true}
      ttl: ${OTP_TTL:PT5M}
      length: ${OTP_LENGTH:6}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      sender: ${OTP_SENDER:console}
      # Development only: when true the console sender prints the code. Never enable in production.
      console-expose-code: ${OTP_CONSOLE_EXPOSE_CODE:false}
      rate-limit:
        phone-requests: ${OTP_RATE_PHONE_REQUESTS:3}
        phone-verifies: ${OTP_RATE_PHONE_VERIFIES:10}
        ip-requests: ${OTP_RATE_IP_REQUESTS:10}
        ip-verifies: ${OTP_RATE_IP_VERIFIES:30}
        window: ${OTP_RATE_WINDOW:PT15M}
    rate-limit:
      # Sign-in entry point (/oauth2/authorization/**), per client address.
      oauth-starts-per-ip: ${AUTH_RATE_OAUTH_STARTS_PER_IP:30}
      window: ${AUTH_RATE_WINDOW:PT15M}

logging:
  level:
    org.flywaydb: INFO
